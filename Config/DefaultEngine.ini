[SystemSettings]
; ---------------------------------------------------------------------------
; VEH-006: the prototype car has no suspension without this.
;
; UChaosWheeledVehicleSimulation::ApplySuspensionForces computes a suspension force
; for every wheel in contact, and then applies it in exactly one of two ways
; (ChaosWheeledVehicleMovementComponent.cpp:605-663):
;
;   DisableConstraintSuspension == 0 (engine default)
;     The force is handed to a per-wheel Chaos FSuspensionConstraint. Those
;     constraints are created in ONE place -- FixupSkeletalMesh(), inside
;     `if (USkeletalMeshComponent* Mesh = Cast<USkeletalMeshComponent>(GetMesh()))`
;     and `if (UPhysicsAsset* PhysicsAsset = Mesh->GetPhysicsAsset())` (:1205-1277).
;
;   DisableConstraintSuspension == 1
;     AddForceAtPosition(SuspensionForceVector, SusApplicationPoint) (:662) --
;     the force-based path the cvar's own help text calls "basic force based
;     suspension without hardstops".
;
; ARacingVehiclePawn is a blockout: its UpdatedComponent is a UBoxComponent, so
; GetMesh() yields no skeletal mesh, no constraints are ever created, and on the
; default path the computed suspension force is simply never applied to anything.
; The car then falls until its collision BOX rests on the ground, the wheels carry
; no load, and a vehicle with a healthy engine and correct inputs cannot move.
;
; That is what this cost: the VEH-006 manoeuvre suite reported 0.00 cm of travel on
; every test with no error and no warning, through seven build-and-run cycles.
; The decisive measurement was the settled pose -- chassis Z exactly 55.00 cm
; (= ChassisHalfHeightCm, i.e. the box bottom exactly on the ground plane) with all
; four suspension offsets pinned at exactly 12.00 cm (= SuspensionMaxRaiseCm, i.e.
; the travel limit). Evidence: Saved/Automation/ReportVEH006Man7/index.json.
;
; SystemSettings rather than a runtime SetOnConsoleVariable call: this is a
; project-wide property of the vehicle we ship, it applies identically to editor,
; automation and packaged builds, and it leaves no gameplay code poking global
; console state at BeginPlay.
;
; REMOVE THIS when the prototype car gains a real skeletal mesh with a physics
; asset. At that point FixupSkeletalMesh creates the constraints, the constraint
; path becomes the better one (it has hardstops, which the force path does not),
; and this line would silently downgrade the suspension.
p.Vehicle.DisableConstraintSuspension=1

