; Phase 0 baseline engine config.
; Values follow the shipped UE 5.8 TP_Blank template unless noted.
; Rendering-quality decisions (Nanite, Lumen, VSM, TSR) are deliberately NOT set
; here: CLAUDE.md requires they be enabled only after measurement on the
; reference GPU worker, which does not exist yet (BLOCKER-001, ADR-0003).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=1
AudioMaxChannels=0
AudioNumSourceWorkers=4

; ---------------------------------------------------------------------------
; CONFIG HYGIENE
;
; Do not commit an [/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
; block here. AndroidFileServer ships with "EnabledByDefault": true
; (AndroidFileServer.uplugin:15), so every editor or cook run rewrote this section
; with a fresh secret-shaped SecurityToken and bAllowNetworkConnection=True.
;
; Deleting the block by hand did not hold: it regenerated during the very next
; BuildCookRun with a new token. The actual fix is upstream of the config --
; AndroidFileServer is now explicitly disabled in RacingSim.uproject, because
; Android is not a target platform for this project.
;
; Three such tokens reached git history (d9ac6c3, 8efbfd5, and one during a cook).
; They are inert -- the plugin is disabled, bIncludeInShipping=False, and Android
; is not built -- so history is left alone rather than rewritten. If this section
; ever reappears, the plugin got re-enabled; fix that, do not just delete the text.
; Tracked under SEC-001. Caught by code-reviewer, 2026-08-10.
; ---------------------------------------------------------------------------

