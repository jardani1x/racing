; CONFIG HYGIENE
;
; Do not commit an [/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
; block here. AndroidFileServer ships with "EnabledByDefault": true
; (AndroidFileServer.uplugin:15), so every editor or cook run rewrote this section
; with a fresh secret-shaped SecurityToken and bAllowNetworkConnection=True.
;
; Deleting the block by hand did not hold: it regenerated during the very next
; BuildCookRun with a new token. The actual fix is upstream of the config --
; AndroidFileServer is now explicitly disabled in RacingSim.uproject, because
; Android is not a target platform for this project.
;
; TWO distinct tokens reached git history, across four commits: d9ac6c3, 8efbfd5,
; c3ab1a7, 46e1b25. (This comment previously said three; an independent search of
; the object graph on 2026-08-12 found two. Corrected.)
;
; They are inert -- the plugin is disabled, bIncludeInShipping=False, and Android
; is not built -- and the repository has no remote, so the history has never left
; this machine. History is therefore left alone FOR NOW, not permanently: rewriting
; costs almost nothing at 9 commits with no remote, and becomes expensive the moment
; a remote is added. The decision is recorded as D-9 in
; Docs/Reports/M0-DecisionSheet.md and must be settled before any remote is added.
;
; If this section ever reappears, the plugin got re-enabled; fix that, do not just
; delete the text.
; Tracked under SEC-001. Caught by code-reviewer 2026-08-10, corrected 2026-08-12.
; ---------------------------------------------------------------------------

