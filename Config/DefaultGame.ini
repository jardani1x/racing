[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=RacingSim

; ---------------------------------------------------------------------------
; AssetManager
;
; The GameFeatures plugin requires a PrimaryAssetTypesToScan rule for
; GameFeatureData or it errors during cook and fails the whole package:
;
;   LogGameFeatures: Error: Asset manager settings do not include a rule for
;   assets of type GameFeatureData, which is required for game feature plugins
;   to function
;
; Raised by Engine/Plugins/Runtime/GameFeatures/Source/GameFeatures/Private/
; GameFeaturesSubsystem.cpp:785.
;
; GameFeatures is pulled in transitively by AllToolsets -> GameFeaturesToolset,
; which Docs/09-UnrealMCP.md requires for Unreal MCP. Editor-only plugins still
; load during cook because the cooker runs UnrealEditor-Cmd; the .uproject
; TargetAllowList governs packaged targets, not the cook commandlet.
;
; This project uses no game feature plugins, so the rule points at an unused
; directory. It exists to satisfy the subsystem, not to scan real content.
; See BLOCKER-005 in Docs/Environment.md.
;
; bIsEditorOnly=True is load-bearing, not cosmetic. AssetManager.cpp:3850 skips
; editor-only entries when !GIsEditor, so the cook (GIsEditor true) still
; registers the rule and silences the GameFeatures error, while the packaged
; build never tries to resolve the class. With bIsEditorOnly=False a packaged
; Game/Client target would attempt to load /Script/GameFeatures.GameFeatureData
; -- a class that is not present there, because GameFeatures is reachable only
; through the Editor-gated AllToolsets -> GameFeaturesToolset chain -- and trip
; ensureMsgf(AssetBaseClassLoaded, ...) in AssetManagerTypes.cpp:82 at startup.
; Caught by code-reviewer, 2026-08-10.
; ---------------------------------------------------------------------------
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

; ---------------------------------------------------------------------------
; Packaging -- test-only and developer-only content must never cook
;
; TEST-001, closing CORE-001 finding N-4. CORE-001 proved that the RacingSimTests
; *module* cannot ship, by searching the packaged binary and the .target receipt.
; Neither check looks at cooked content. Content/Tests/Maps/ -- which
; Docs/15-ProjectStructure.md reserves for functional-test maps -- would cook into
; the pak like any other content and ship, and nothing would have noticed.
;
; DirectoriesToNeverCook is the correct control, and it is stronger than simply not
; referencing the content: the comment on the property (ProjectPackagingSettings.h:
; 570-575) is "should never be cooked *even if they are referenced by your project*".
; That matters, because a functional-test map legitimately references real gameplay
; content, and a stray reference in the other direction -- or an AssetManager
; primary-asset rule -- is exactly how test content gets dragged into a cook.
;
; Consumed by UCookOnTheFlyServer at CookOnTheFlyServer.cpp:12463. The section is
; named UnrealEd rather than DeveloperToolSettings because the class moved modules
; and BaseEngine.ini:960 carries the ClassRedirect; BaseGame.ini:87 still writes the
; UnrealEd name, so this file matches the engine's own spelling rather than the
; current module.
;
; Paths are cooked package paths (/Game/...), not filesystem paths. /Game maps to
; Content/, so /Game/Tests is Content/Tests/.
;
; /Game/Developer is listed for the same reason: Docs/15-ProjectStructure.md marks
; Content/Developer/ "never referenced by shipping content", which is a convention
; until something enforces it.
;
; Verified by Scripts/Test/Check-NonShippingArtifacts.ps1 -Mode Pak, which searches
; the packaged pak/ucas/utoc containers for those cooked path prefixes and carries a
; positive control so a null result means absence rather than a broken search.
; ---------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToNeverCook=(Path="/Game/Tests")
+DirectoriesToNeverCook=(Path="/Game/Developer")
