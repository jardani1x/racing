[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=RacingSim

; ---------------------------------------------------------------------------
; AssetManager
;
; The GameFeatures plugin requires a PrimaryAssetTypesToScan rule for
; GameFeatureData or it errors during cook and fails the whole package:
;
;   LogGameFeatures: Error: Asset manager settings do not include a rule for
;   assets of type GameFeatureData, which is required for game feature plugins
;   to function
;
; Raised by Engine/Plugins/Runtime/GameFeatures/Source/GameFeatures/Private/
; GameFeaturesSubsystem.cpp:785.
;
; GameFeatures is pulled in transitively by AllToolsets -> GameFeaturesToolset,
; which Docs/09-UnrealMCP.md requires for Unreal MCP. Editor-only plugins still
; load during cook because the cooker runs UnrealEditor-Cmd; the .uproject
; TargetAllowList governs packaged targets, not the cook commandlet.
;
; This project uses no game feature plugins, so the rule points at an unused
; directory. It exists to satisfy the subsystem, not to scan real content.
; See BLOCKER-005 in Docs/Environment.md.
;
; bIsEditorOnly=True is load-bearing, not cosmetic. AssetManager.cpp:3850 skips
; editor-only entries when !GIsEditor, so the cook (GIsEditor true) still
; registers the rule and silences the GameFeatures error, while the packaged
; build never tries to resolve the class. With bIsEditorOnly=False a packaged
; Game/Client target would attempt to load /Script/GameFeatures.GameFeatureData
; -- a class that is not present there, because GameFeatures is reachable only
; through the Editor-gated AllToolsets -> GameFeaturesToolset chain -- and trip
; ensureMsgf(AssetBaseClassLoaded, ...) in AssetManagerTypes.cpp:82 at startup.
; Caught by code-reviewer, 2026-08-10.
; ---------------------------------------------------------------------------
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
